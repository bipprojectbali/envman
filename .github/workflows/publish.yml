name: Publish Docker to GHCR

on:
  workflow_dispatch:
    inputs:
      stack_env:
        description: "stack env"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - prod
          - stg
      tag:
        description: "Image tag (e.g. 1.0.0)"
        required: true
        default: "1.0.0"


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & Push to GHCR ${{ github.repository }}:${{ github.event.inputs.stack_env }}-${{ github.event.inputs.tag }}
    runs-on: ubuntu-latest
    environment: ${{ vars.PORTAINER_ENV || 'portainer' }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout branch ${{ github.event.inputs.stack_env }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.stack_env }}

      - name: Checkout scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .ci
          sparse-checkout: .github/workflows/script

      # ── Build CLI binaries + upload to GitHub Releases ───────────────────────
      # CLI binaries are NOT bundled in the Docker image (saves ~450MB).
      # Download endpoint /download/cli/:platform redirects here (302).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI binaries (all platforms)
        run: bun run build:cli

      - name: Upload CLI binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.event.inputs.tag }}"
          # Create release if it doesn't exist yet (idempotent)
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "CLI binaries for envman $TAG" \
            2>/dev/null || true
          # Upload all binaries (--clobber overwrites if re-running same tag)
          for f in dist/cli/envman-* dist/cli/*.exe; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          echo "✓ CLI binaries uploaded to $TAG"

      # ── Deploy CLI binaries ke server (serve lokal, lebih cepat dari GitHub CDN) ──
      - name: Deploy CLI binaries ke server
        if: ${{ secrets.CLI_DEPLOY_HOST != '' }}
        env:
          CLI_DEPLOY_HOST: ${{ secrets.CLI_DEPLOY_HOST }}
          CLI_DEPLOY_USER: ${{ secrets.CLI_DEPLOY_USER }}
          CLI_DEPLOY_KEY: ${{ secrets.CLI_DEPLOY_KEY }}
          CLI_DEPLOY_PATH: ${{ secrets.CLI_DEPLOY_PATH || '/opt/envman/cli-dist' }}
          STACK_ENV: ${{ github.event.inputs.stack_env }}
        run: |
          mkdir -p ~/.ssh
          echo "$CLI_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$CLI_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Buat direktori di server jika belum ada
          ssh -i ~/.ssh/deploy_key "$CLI_DEPLOY_USER@$CLI_DEPLOY_HOST" \
            "mkdir -p $CLI_DEPLOY_PATH"
          # Upload hanya .gz (lebih kecil, ~60% dari raw)
          for f in dist/cli/*.gz; do
            [ -f "$f" ] && scp -i ~/.ssh/deploy_key "$f" \
              "$CLI_DEPLOY_USER@$CLI_DEPLOY_HOST:$CLI_DEPLOY_PATH/"
          done
          echo "✓ CLI .gz binaries deployed to $CLI_DEPLOY_HOST:$CLI_DEPLOY_PATH"

      # ── Docker build ──────────────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.stack_env }}-${{ github.event.inputs.tag }}
            type=raw,value=${{ github.event.inputs.stack_env }}-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

      - name: Notify success
        if: success()
        run: bash ./.ci/.github/workflows/script/notify.sh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_STATUS: success
          NOTIFY_WORKFLOW: "Publish Docker"
          NOTIFY_DETAIL: "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.stack_env }}-${{ github.event.inputs.tag }}"

      - name: Notify failure
        if: failure()
        run: bash ./.ci/.github/workflows/script/notify.sh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_STATUS: failure
          NOTIFY_WORKFLOW: "Publish Docker"
          NOTIFY_DETAIL: "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.stack_env }}-${{ github.event.inputs.tag }}"
