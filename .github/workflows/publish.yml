name: Publish Docker to GHCR

on:
  workflow_dispatch:
    inputs:
      stack_env:
        description: "stack env"
        required: true
        type: choice
        default: "dev"
        options:
          - dev
          - prod
          - stg
      tag:
        description: "Image tag (e.g. 1.0.0)"
        required: true
        default: "1.0.0"


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build & Push to GHCR ${{ github.repository }}:${{ github.event.inputs.stack_env }}-${{ github.event.inputs.tag }}
    runs-on: ubuntu-latest
    environment: ${{ vars.PORTAINER_ENV || 'portainer' }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout branch ${{ github.event.inputs.stack_env }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.stack_env }}

      - name: Checkout scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .ci
          sparse-checkout: .github/workflows/script

      # ── Build CLI binaries + upload to GitHub Releases ───────────────────────
      # CLI binaries are NOT bundled in the Docker image (saves ~450MB).
      # Download endpoint /download/cli/:platform redirects here (302).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI binaries (all platforms)
        run: bun run build:cli

      - name: Upload CLI binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.event.inputs.tag }}"
          # Create release if it doesn't exist yet (idempotent)
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "CLI binaries for envman $TAG" \
            2>/dev/null || true
          # Upload all binaries (--clobber overwrites if re-running same tag)
          for f in dist/cli/envman-* dist/cli/*.exe; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
          echo "✓ CLI binaries uploaded to $TAG"

      # ── Upload CLI ke app via HTTP (tanpa SSH, cukup secret) ────────────────────
      # File di-overwrite setiap deploy → hanya 1 versi (latest) di volume
      # Skip otomatis jika CLI_UPLOAD_SECRET atau APP_URL tidak di-set
      - name: Upload CLI binaries ke server
        env:
          CLI_UPLOAD_SECRET: ${{ secrets.CLI_UPLOAD_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CLI_UPLOAD_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CLI_UPLOAD_SECRET atau APP_URL belum di-set, skip upload"
            exit 0
          fi
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            if [ "$platform" = "windows-x64" ]; then
              gz="dist/cli/envman-windows-x64.exe.gz"
            else
              gz="dist/cli/envman-${platform}.gz"
            fi
            [ -f "$gz" ] || continue
            echo "Uploading $platform..."
            curl -fsSL -X POST \
              -H "x-cli-upload-secret: $CLI_UPLOAD_SECRET" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$gz" \
              "$APP_URL/api/admin/cli/upload/$platform"
          done
          echo "✓ CLI binaries uploaded"

      # ── Docker build ──────────────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.stack_env }}-${{ github.event.inputs.tag }}
            type=raw,value=${{ github.event.inputs.stack_env }}-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true

      - name: Notify success
        if: success()
        run: bash ./.ci/.github/workflows/script/notify.sh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_STATUS: success
          NOTIFY_WORKFLOW: "Publish Docker"
          NOTIFY_DETAIL: "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.stack_env }}-${{ github.event.inputs.tag }}"

      - name: Notify failure
        if: failure()
        run: bash ./.ci/.github/workflows/script/notify.sh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_STATUS: failure
          NOTIFY_WORKFLOW: "Publish Docker"
          NOTIFY_DETAIL: "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.stack_env }}-${{ github.event.inputs.tag }}"
