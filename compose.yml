services:
  envman:
    image: ghcr.io/bipprojectbali/envman:stg-latest
    container_name: envman-stg
    restart: unless-stopped
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      # Redis
      - REDIS_URL=${REDIS_URL}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Secret encryption (AES-256-GCM)
      - MASTER_KEY=${MASTER_KEY}
      # App
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - AUDIT_LOG_RETENTION_DAYS=${AUDIT_LOG_RETENTION_DAYS:-90}
      # MCP
      - MCP_SECRET=${MCP_SECRET}
      - MCP_SECRET_ADMIN=${MCP_SECRET_ADMIN}
      # Telegram
      - TELEGRAM_NOTIFY_TOKEN=${TELEGRAM_NOTIFY_TOKEN}
      - TELEGRAM_NOTIFY_CHAT_ID=${TELEGRAM_NOTIFY_CHAT_ID}
    networks:
      - public-net
      - postgres-net-stg
      - redis-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public-net"
      - "traefik.http.routers.envman.rule=Host(`envman.wibudev.com`)"
      - "traefik.http.routers.envman.entrypoints=websecure"
      - "traefik.http.routers.envman.tls=true"
      - "traefik.http.routers.envman.tls.certresolver=letsencrypt"
      - "traefik.http.services.envman.loadbalancer.server.port=3000"

  migrate:
    image: ghcr.io/bipprojectbali/envman:stg-latest
    container_name: envman-stg-migrate
    restart: "no"
    entrypoint: ["sh", "-c", "bun prisma migrate deploy && bun prisma/seed.ts"]
    environment:
      - DATABASE_URL=${DIRECT_URL}
      - DIRECT_URL=${DIRECT_URL}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
    networks:
      - postgres-net-stg

networks:
  public-net:
    external: true
  postgres-net-stg:
    external: true
  redis-net:
    external: true
